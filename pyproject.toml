[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-record"
version = "0.0.1"
description = "A minimal schema for a written down research conclusion, and a validator for it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "navneet", email = "navn07588@gmail.com" }]
# Everything research_record and the pipeline import at run time. Minimums are the versions the suite last passed on.
# anthropic is pinned, not a minimum: a newer SDK once changed what create() accepts (BACKLOG, the temperature entry).
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "anthropic==1.7.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.2",
    "huggingface_hub>=2.0.0",
]

[project.optional-dependencies]
# httpx2 is the SDK's HTTP client; tests/test_llm.py builds a mock transport from it.
dev = ["pytest>=9.1.1", "httpx2>=2.13.0"]
# Kept so `.[pipeline]` and `.[postgres]` (the workflows, older notes) still resolve; both are in the dependencies now.
pipeline = []
postgres = []

[project.scripts]
rr = "research_record.cli:main"

[tool.setuptools]
packages = ["research_record"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits the live SEC endpoint", "postgres: needs a Postgres to run against (DATABASE_URL); uses a schema of its own, never public"]
