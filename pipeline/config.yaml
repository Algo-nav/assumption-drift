edgar:
  user_agent: "Navneet navn07588@gmail.com"
  max_rps: 8
  filing_types: ["8-K", "10-K", "10-Q"]
  date_from: "2019-01-01"
  date_to: "2026-09-20"
# Navneet fills the full 30; three to prove the pipeline end to end.
# fiscal_year_end_month is the month the fiscal year ends in (from each company's 10-K cover page). It
# dates a period label such as "Q4 FY21", so a table header that only names periods already over on the
# filing date is not taken for a guidance header. fiscal_year_named_for says which calendar year the label
# carries: "end" (the default) for a year that ENDS in it (NVIDIA fiscal 2024 ended January 28, 2024),
# "start" for a year that STARTS in it (Target fiscal 2022 ended January 28, 2023).
companies:
  - {name: "NVIDIA Corporation", ticker: "NVDA", cik: "0001045810", fiscal_year_end_month: 1}
  - {name: "Target Corporation", ticker: "TGT", cik: "0000027419", fiscal_year_end_month: 1, fiscal_year_named_for: start}
  - {name: "Salesforce, Inc.", ticker: "CRM", cik: "0001108524", fiscal_year_end_month: 1}
# The only metrics a draft may be about. Haiku must pick from this list or return nothing, so a
# figure for anything else (gross profit, growth rates, segment revenue) never becomes a row.
# Capital return, buybacks and dividends are deliberately not here.
metrics:
  - "revenue"
  - "gross margin GAAP"
  - "gross margin non-GAAP"
  - "operating expenses GAAP"
  - "operating expenses non-GAAP"
  - "operating margin GAAP"
  - "operating margin non-GAAP"
  - "operating income"
  - "EPS GAAP"
  - "EPS non-GAAP"
  - "tax rate"
  - "other income and expense"
  - "comparable sales"
  - "free cash flow"

# What each metric is measured in. A draft whose unit is the wrong kind for its metric is rejected
# in code, whatever the model said: a margin is never dollars, and operating income or free cash
# flow is never a percentage. The unit kinds are in 03_structure.py (UNIT_KIND):
#   dollars    USD, USD thousands, USD millions, USD billions
#   per share  USD per share
#   percent    percent, percentage points, basis points
metric_kinds:
  "revenue": dollars
  "gross margin GAAP": percent
  "gross margin non-GAAP": percent
  "operating expenses GAAP": dollars
  "operating expenses non-GAAP": dollars
  "operating margin GAAP": percent
  "operating margin non-GAAP": percent
  "operating income": dollars
  "EPS GAAP": per share
  "EPS non-GAAP": per share
  "tax rate": percent
  "other income and expense": dollars
  "comparable sales": percent
  "free cash flow": dollars

llm:
  model: "claude-haiku-4-5"
  budget_usd: 10   # one budget across 03_structure and 04_outcomes, not one each
  # Haiku 4.5 list prices in USD per million tokens, and the Message Batches discount.
  price_input_per_mtok: 1.00
  price_output_per_mtok: 5.00
  batch_discount: 0.5
hf:
  user: "{HF_USER}"
  dataset: "assumption-drift"

# Phase 1, 02_candidates.py. A sentence is a candidate when it has at least one
# forward term AND at least one number with a unit. Recall matters more than
# precision here: the Haiku pass in Phase 2 throws away what is not guidance.
candidates:
  # Case-insensitive regular expressions, matched on word boundaries.
  forward_terms:
    - 'expect(?:s|ed|ing)?'
    - 'guidance'
    - 'outlook'
    - 'anticipat(?:e|es|ed|ing)'
    - 'forecast(?:s|ed|ing)?'
    # Lower case only: Target Corporation's own name would otherwise match every
    # sentence it appears in.
    - '(?-i:targets?|targeted|targeting)'
    - 'full[- ]year'
    - 'fiscal (?:year )?20\d\d'
  # A bare number does not count. It needs a currency sign, a percent sign, or
  # one of these unit words straight after it.
  number_units:
    - 'percent'
    - 'per cent'
    - 'basis points?'
    - 'bps'
    - 'pts'
    - 'points?'
    - 'cents?'
    - 'thousand'
    - 'million'
    - 'billion'
    - 'trillion'
    - 'units'
    - 'stores'
    - 'locations'
  # Segments longer than this are table blobs or legal boilerplate. Dropped and counted.
  max_sentence_chars: 1200

  # Section capture, 8-K exhibits only. Guidance often sits in a table or bullet list under a
  # heading, with the label and the number on separate lines, so no single sentence carries
  # both. The whole block is one candidate and one request, never a bare value line alone.
  # A heading is a short line (at most `heading_max_words` words) that matches `section_heading`
  # and does not end like a sentence. A block runs from the line after its heading until the
  # first of:
  #   another matching heading; a line matching `section_end_headings` (Highlights, Results...);
  #   a blank-line gap of `section_gap_lines` or more; a short title-like line after a gap of
  #   `section_heading_gap` or more (unless it is a table label, which is followed by a value);
  #   or `section_max_lines` lines. "Blank lines" are the ones the extractor collapsed, so a
  #   gap of 4 means the layout had a section break there. Table rows can have gaps of 3 to 6.
  # A block's figures often sit in columns whose periods are named in a header row ABOVE the heading.
  # The header is found within `table_header_lookback_lines` lines above the block: the nearest line that
  # names two or more periods ("Q2 2023 Full Year 2023"), or, where the header cells were broken onto
  # separate lines (Salesforce), the lines that name a period, joined with " | ". A cell is at most
  # `table_header_max_words` long and nothing but period labels and words like "Guidance". A line with
  # Y/Y, vs, change or % is never a cell, and a header whose periods all ended before the filing date is a
  # table of results, not guidance (it needs the company's fiscal_year_end_month, above). It is stored on
  # the candidate as `table_header` and shown to the model as the first line of the block. It is never part
  # of the evidence excerpt.
  table_header_lookback_lines: 10
  table_header_max_words: 10
  section_heading: '\b(?:Financial Outlook|Guidance|Outlook)\b'
  section_max_lines: 40
  section_gap_lines: 8
  section_heading_gap: 4
  heading_max_words: 8
  section_end_headings:
    - '(?:Business |Financial |Company )?Highlights'
    - '(?:Financial |Operating |Consolidated )?Results(?: of Operations)?'
    - 'Reconciliations?.*'
    - 'Conference Call.*'
    - '.*Webcast.*'
    - 'Non-GAAP (?:Financial )?Measures.*'
    - 'Forward-Looking.*'
    - 'Safe Harbor.*'
    - 'About .*'
    - 'Shareholder Letter'
    - '(?:Investor |Media )?Contacts?:?'

  # Context stored with every candidate: the nearest preceding lead-in line (a line
  # ending in a colon, searched back `lead_in_lookback_lines` lines, at most
  # `lead_in_max_chars` long), and `context_sentences` sentences either side.
  # Each stored context string is cut to `context_max_chars`.
  lead_in_lookback_lines: 15
  lead_in_max_chars: 400
  context_sentences: 2
  context_max_chars: 300

# Phase 2, 04_outcomes.py. Regex narrows the search, Haiku reads what is left.
# Outcomes and withdrawals are looked for in 8-K exhibits only. Acknowledgements are looked for in every
# cached filing: the 8-K exhibits, the 10-Q and the 10-K.
outcomes:
  search_days: 550      # look this far past stated_at for the release reporting the period
  ack_days: 400         # and this far past the outcome for an acknowledgement
  head_chars: 2500      # when a headline names no year, look for it in this much of the release
  max_docs: 3           # earliest matching releases to read
  max_lines: 25         # lines sent to the model per draft, best-ranked first
  section_lookback_lines: 25
  units_lookback_lines: 40
  plausible_ratio: 5    # a reported value over 5x, or under 1/5, of the guidance is a unit or row mix-up
  # First pattern that matches the metric name decides which words a line must contain.
  metric_terms:
    - {when: 'revenue|net sales|total sales', match: 'revenue|net sales|total sales'}
    - {when: 'gross margin', match: 'gross margin'}
    - {when: 'operating margin|operating income margin', match: 'operating (?:income )?margin|operating income rate'}
    - {when: 'operating income', match: 'operating income|income from operations|operating profit'}
    - {when: 'operating expense|opex', match: 'operating expenses'}
    - {when: 'eps|earnings per share|per share', match: 'earnings per share|eps|per diluted share|diluted earnings'}
    - {when: 'tax rate', match: 'tax rate'}
    - {when: 'operating cash flow', match: 'operating cash flow|cash flow from operations|cash provided by operat'}
    - {when: 'free cash flow', match: 'free cash flow'}
    - {when: 'other income', match: 'other income'}
    - {when: 'crpo|remaining performance', match: 'crpo|remaining performance obligation'}
    - {when: 'capital expenditure|capex', match: 'capital expenditures|capex|capital spending'}
    - {when: 'comparable sales', match: 'comparable sales'}
  # A withdrawal is looked for in the 8-K exhibits filed after the guidance and up to the day the period closed.
  # A sentence is read when it has one of these phrases AND one of the subjects: "suspending its dividend" is not
  # about guidance, and "outlook" alone is not a withdrawal. The model then says whether the sentence really is
  # the company withdrawing, suspending or no longer providing guidance that covers the draft's metric and period.
  withdrawal_phrases:
    - 'withdr(?:aw|aws|ew|awn|awing|awal)'
    - 'suspend(?:s|ed|ing)?'
    - 'suspension'
    - 'no longer (?:provid|issu|giv)(?:e|es|ing)'
  withdrawal_subjects: 'guidance|outlook|forecast|expectations|projections|targets?'
  acknowledgement_phrases:
    - 'below'
    - 'short of'
    - 'fell short'
    - 'shortfall'
    - 'did not meet'
    - 'lower than our'
    - 'lower than expected'
    - 'less than expected'
    - 'missed'
    - 'revised'
